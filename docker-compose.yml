services:
  db:
    image: postgres:16
    container_name: skyrouter-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: skyrouter
      POSTGRES_PASSWORD: skyrouter
      POSTGRES_DB: skyrouter
    ports:
      - "5432:5432"
    volumes:
      - skyrouter-db-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skyrouter -d skyrouter"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: skyrouter-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: skyrouter
      DB_PASSWORD: skyrouter
      DB_NAME: skyrouter
      DB_POOL_MAX: 20
      PORT: 3000
    ports:
      - "3000:3000"

  frontend:
    image: node:20-alpine
    container_name: skyrouter-frontend
    restart: unless-stopped
    working_dir: /app
    depends_on:
      - api
    environment:
      VITE_API_BASE_URL: http://localhost:3000/api
    volumes:
      - ./frontend:/app
      - skyrouter-frontend-node-modules:/app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  skyrouter-db-data:
  skyrouter-frontend-node-modules:
